name: 福彩3D选5胆码 自动更新&生成网页上线
on:
  workflow_dispatch: # 可以手动点击运行
  schedule:
    - cron: '0 12 * * *' # 每天自动执行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-build-page:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 运行原始抓取脚本
        run: python main.py

      - name: 执行渲染，生成网页index.html
        run: |
          python render_html.py
          ls -la

      - name: 配置Pages
        uses: actions/configure-pages@v4

      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: 部署上线
        uses: actions/deploy-pages@v4
